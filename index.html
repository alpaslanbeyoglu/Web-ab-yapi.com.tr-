          <h2>Hizmetlerimiz</h2>
          <ul>
            <li>
              <h3>Fatih Kentsel Dönüşüm ve 6306 Sayılı Kanun Danışmanlığı</h3>
              <p>Arsa payı sahiplerinin %50+1 salt çoğunluk kararından riskli yapı tespitine, Yarısı Bizden kampanyası bilgilendirmesinden noter sözleşmelerine kadar tüm yasal ve teknik süreçlerin şeffaf yönetimi.</p>
            </li>
            <li>
              <h3>Kat Karşılığı İnşaat</h3>
              <p>Cerrahpaşa, Kocamustafapaşa, Aksaray, Silivrikapı, Samatya ve Fatih genelinde hak sahiplerine adil, şeffaf ve resmi kat paylaşım sözleşmeleriyle değer kazandıran projeler.</p>
            </li>
            <li>
              <h3>Anahtar Teslim Müteahhitlik</h3>
              <p>Ruhsat, yıkım, hafriyat, kaba ve ince inşaat ile iskan aşamalarının tamamını kapsayan, zamanında teslim garantili anahtar teslim yapı çözümleri.</p>
            </li>
          </ul>

          <ul>

              <h3>C30 Beton ve Projeye Özel Beton Sınıfı</h3>
              <p>Zemin etüdü ve onaylı statik hesaplara uygun olarak minimum C30 beton ve proje gereksinimine göre daha yüksek dayanımlı hazır beton sınıfları (C35, C40 vb.) ile üretim.</p>
            </li>
            <li>
              <h3>Radye Temel Mühendisliği</h3>
              <p>2018 Türkiye Bina Deprem Yönetmeliği (TBDY 2018) standartlarına tam uyumlu radye jeneral temel sistemi, perde duvarlar ve nervürlü çelik donatı uygulaması.</p>
            </li>
