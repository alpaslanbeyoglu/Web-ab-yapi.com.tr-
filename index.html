    <script>
      // Suppress Vite HMR WebSocket disconnect errors in sandboxed environments (per guidelines)
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event &&
          event.reason &&
          (
            (typeof event.reason.message === 'string' && (
              event.reason.message.includes('WebSocket') ||
              event.reason.message.includes('vite') ||
              event.reason.message.includes('ws')
            )) ||
            (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client'))
          )
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function(event) {
        if (
          event &&
          (
            (event.filename && event.filename.includes('@vite/client')) ||
            (typeof event.message === 'string' && (
              event.message.includes('WebSocket') ||
              event.message.includes('vite')
            ))
          )
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
