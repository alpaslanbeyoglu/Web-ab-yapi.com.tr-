<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 114" width="450" height="114">
  
  <defs>
    <!-- Left Pillar: Charcoal / Deep Slate -->
    <linearGradient id="slateL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222F37" />
      <stop offset="100%" stop-color="#2A3841" />
    </linearGradient>
    <linearGradient id="slateR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#384953" />
      <stop offset="100%" stop-color="#435560" />
    </linearGradient>
    <linearGradient id="slateRoofL" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2D3B43" />
      <stop offset="100%" stop-color="#374751" />
    </linearGradient>
    <linearGradient id="slateRoofR" x1="50%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#435560" />
      <stop offset="100%" stop-color="#51646F" />
    </linearGradient>

    <!-- Center Pillar: Rich Deep Petroleum Teal -->
    <linearGradient id="tealL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F5A65" />
      <stop offset="100%" stop-color="#146F7C" />
    </linearGradient>
    <linearGradient id="tealR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A8190" />
      <stop offset="100%" stop-color="#2397A7" />
    </linearGradient>
    <linearGradient id="tealRoofL" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#15727F" />
      <stop offset="100%" stop-color="#1C8391" />
    </linearGradient>
    <linearGradient id="tealRoofR" x1="50%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2195A5" />
      <stop offset="100%" stop-color="#2DAABB" />
    </linearGradient>

    <!-- Right Pillar: Warm Architectural Amber Gold -->
    <linearGradient id="amberL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5750F" />
      <stop offset="100%" stop-color="#D78416" />
    </linearGradient>
    <linearGradient id="amberR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5941F" />
      <stop offset="100%" stop-color="#F4A52B" />
    </linearGradient>
    <linearGradient id="amberRoofL" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D78416" />
      <stop offset="100%" stop-color="#E7951F" />
    </linearGradient>
    <linearGradient id="amberRoofR" x1="50%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0A026" />
      <stop offset="100%" stop-color="#FFB83C" />
    </linearGradient>
  </defs>

  <!-- Tight Emblem on Left -->
  <g transform="translate(0, 2) scale(0.534)">
    
  <g id="emblem-towers">
    <!-- 1. LEFT TOWER (Charcoal / Slate) -->
    <!-- Bounds: X: 0 to 56, Y: 52 to 196 -->
    <g id="tower-slate">
      <polygon points="0,74 28,52 28,82" fill="url(#slateRoofL)" />
      <polygon points="28,52 56,74 28,82" fill="url(#slateRoofR)" />
      <polygon points="0,74 28,82 28,196 0,182" fill="url(#slateL)" />
      <polygon points="28,82 56,74 56,182 28,196" fill="url(#slateR)" />
    </g>

    <!-- 2. CENTER TOWER (Tall Rich Teal) -->
    <!-- Bounds: X: 64 to 132, Y: 0 to 206 -->
    <g id="tower-teal">
      <polygon points="64,26 98,0 98,36" fill="url(#tealRoofL)" />
      <polygon points="98,0 132,26 98,36" fill="url(#tealRoofR)" />
      <polygon points="64,26 98,36 98,206 64,190" fill="url(#tealL)" />
      <polygon points="98,36 132,26 132,190 98,206" fill="url(#tealR)" />
    </g>

    <!-- 3. RIGHT TOWER (Warm Amber / Gold) -->
    <!-- Bounds: X: 140 to 196, Y: 38 to 196 -->
    <g id="tower-amber">
      <polygon points="140,62 168,38 168,70" fill="url(#amberRoofL)" />
      <polygon points="168,38 196,62 168,70" fill="url(#amberRoofR)" />
      <polygon points="140,62 168,70 168,196 140,182" fill="url(#amberL)" />
      <polygon points="168,70 196,62 196,182 168,196" fill="url(#amberR)" />
    </g>
  </g>

  </g>

  <!-- Typography on Right -->
  <g transform="translate(120, 0)">
    <text x="0" y="70"
          font-family="'Cabinet Grotesk', 'Outfit', 'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
          font-size="68"
          font-weight="900"
          fill="#FFFFFF"
          letter-spacing="0.04em"
          text-anchor="start">
      AB YAPI
    </text>
    <text x="2" y="102"
          font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
          font-size="15"
          font-weight="800"
          fill="#5EEAD4"
          letter-spacing="0.22em"
          text-anchor="start">
      GÜVENE YÜKSELEN YAPILAR
    </text>
  </g>
</svg>