<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AB Yapı | Güvene Yükselen Yapılar - İstanbul Kentsel Dönüşüm & İnşaat</title>
    <meta name="description" content="AB Yapı kurumsal web sitesi. İstanbul kentsel dönüşüm süreçleri, inşaat istatistikleri, tamamlanan ve devam eden projelerimiz, etkileşimli harita ve yasal mevzuat rehberi." />
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages 404 handling
      var pathSegmentsToKeep = 0;
      var l = window.location;
      if (l.search) {
        var q = {};
        l.search.slice(1).split('&').forEach(function(v) {
          var k = v.split('=');
          q[k[0]] = k[1] && decodeURIComponent(k[1].replace(/\+/g, '%20'));
        });
        if (q.p !== undefined) {
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + (q.p || '') +
            (l.hash ? ('#' + l.hash) : '')
          );
        }
      } else {
        // Redirect to index with route path stored in query
        var redirect = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
        if (redirect) {
          window.location.replace(
            l.protocol + '//' + l.host + '/' +
            (l.search ? ('?' + l.search + '&') : '?') +
            'p=/' + redirect +
            (l.hash ? ('#' + l.hash) : '')
          );
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-teal-600 selection:text-white">
    <div id="root"></div>
  </body>
</html>
