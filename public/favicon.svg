      <stop offset="0%" stop-color="#212b3a" />
      <stop offset="100%" stop-color="#2a3648" />
    </linearGradient>
    <linearGradient id="favSlateR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#344256" />
      <stop offset="100%" stop-color="#3e4f67" />
    </linearGradient>
    <linearGradient id="favTealL" x1="0%" y1="0%" x2="100%" y2="0%">
