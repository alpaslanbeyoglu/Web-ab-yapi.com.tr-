    <polygon points="265,90 300,120 265,120" fill="#fab956" />
    <polygon points="230,120 265,120 265,315 230,290" fill="url(#favAmberL)" />
    <polygon points="265,120 300,120 300,290 265,315" fill="url(#favAmberR)" />

    <!-- CENTER TOWER -->
    <polygon points="155,60 190,25 190,60" fill="#2b94a6" />
    <polygon points="190,25 225,60 190,60" fill="#4fc9df" />
    <polygon points="155,60 190,60 190,345 155,315" fill="url(#favTealL)" />
    <polygon points="190,60 225,60 225,315 190,345" fill="url(#favTealR)" />
